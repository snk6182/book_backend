name: Java Application Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Maven Clean Package
        run: mvn clean package    

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Build
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/book_backend:v1 .   

      - name: Docker Push
        run: docker push ${{ secrets.DOCKER_USERNAME }}/book_backend:v1

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.2
        with:
            host: ${{ secrets.SERVER_HOST }}
            username: ${{ secrets.SERVER_USERNAME }}
            key: ${{ secrets.SERVER_SSH_KEY }}
            script: |
              docker pull ${{ secrets.DOCKER_USERNAME }}/book_backend:v1
              docker stop book_backend || true
              docker rm book_backend || true
              docker run -d \
              --name book_backend \
              -p 8085:5000 \
              ${{ secrets.DOCKER_USERNAME }}/book_backend:v1
              

        
